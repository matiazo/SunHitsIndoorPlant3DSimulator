[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sun-hit-detector"
version = "2.2.1"
description = "A deterministic geometric simulator for sunlight-plant hit detection"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Sun Plant Simulator Team"}
]
keywords = ["simulation", "sunlight", "3d", "geometry", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "tzdata>=2023.3",
]

[project.urls]
Homepage = "https://github.com/matiazo/SunHitsIndoorPlant3DSimulator"
Repository = "https://github.com/matiazo/SunHitsIndoorPlant3DSimulator"
Issues = "https://github.com/matiazo/SunHitsIndoorPlant3DSimulator/issues"

[project.optional-dependencies]
visualization = ["plotly>=5.18.0"]
full = ["plotly>=5.18.0", "pydantic>=2.0.0", "tzdata>=2023.3"]
dev = ["pytest>=7.4.0"]

[project.scripts]
sun-hit-detect = "sun_hit_detector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sun_hit_detector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
