name: Auto Release & Publish

on:
  push:
    branches: [master]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Check changes, release & publish
    runs-on: ubuntu-latest
    # Skip auto-version-bump commits (pushed by this workflow)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    environment: pypi

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect PyPI-relevant changes
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          # On first push, before is all zeros
          if echo "$BEFORE" | grep -qE '^0+$'; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
          fi
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE "^sun_hit_detector/|^pyproject\.toml"; then
            echo "pypi=true" >> "$GITHUB_OUTPUT"
            echo "→ PyPI package code changed — will publish"
          else
            echo "pypi=false" >> "$GITHUB_OUTPUT"
            echo "→ No PyPI package changes — skipping publish"
          fi

      - name: Bump patch version
        if: steps.changes.outputs.pypi == 'true'
        id: version
        run: |
          CURRENT=$(grep '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=$((PATCH + 1))
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumping: $CURRENT → $NEW"

          sed -i "s/^version = .*/version = \"$NEW\"/" pyproject.toml
          sed -i "s/\"version\": \".*\"/\"version\": \"$NEW\"/" custom_components/sun_shade_integration/manifest.json

          echo "=== Verify ==="
          grep '^version' pyproject.toml
          grep '"version"' custom_components/sun_shade_integration/manifest.json

      - name: Commit & tag
        if: steps.changes.outputs.pypi == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml custom_components/sun_shade_integration/manifest.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.new }} [skip ci]"
          git tag "v${{ steps.version.outputs.new }}"
          git push origin master --tags

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.pypi == 'true'
        with:
          python-version: "3.12"

      - name: Build package
        if: steps.changes.outputs.pypi == 'true'
        run: |
          pip install build
          python -m build
          echo "=== Built ==="
          ls -la dist/

      - name: Create GitHub Release
        if: steps.changes.outputs.pypi == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.new }}"
          name: "v${{ steps.version.outputs.new }}"
          generate_release_notes: true

      - name: Publish to PyPI
        if: steps.changes.outputs.pypi == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
